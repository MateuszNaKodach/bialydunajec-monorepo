# Axoniq Clarity for this app: TLS with the demo certificate, and the change capture of the app's PostgreSQL, every
# table of it (see README.md). As the axoniq-clarity repo's demo/clarity/application.properties.
server.ssl.bundle=demo
spring.ssl.bundle.pem.demo.keystore.certificate=file:/tls/server.pem
spring.ssl.bundle.pem.demo.keystore.private-key=file:/tls/server-key.pem

# system: the database name in the backend's JDBC URL, which the agent's database-transaction references carry
diamond.debezium.databases[0].system=bialydunajec-postgres-db
diamond.debezium.databases[0].hostname=postgres
diamond.debezium.databases[0].port=5432
diamond.debezium.databases[0].name=bialydunajec-postgres-db
diamond.debezium.databases[0].slot-name=diamond_bialydunajec
diamond.debezium.databases[0].username=diamond
diamond.debezium.databases[0].password=diamond
